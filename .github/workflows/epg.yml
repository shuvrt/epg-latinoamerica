name: Actualizar EPG GatoTV

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: actualizar-epg
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Versiones
        run: node -v && npm -v

      - name: Instalar dependencias
        run: npm ci

      - name: Generar guía
        run: npm run grab -- --sites=gatotv.com

      - name: Preparar publicación
        run: |
          mkdir -p _site
          cp guide.xml _site/guide.xml
          test -s _site/guide.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
